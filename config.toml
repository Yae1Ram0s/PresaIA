# =============================================================================
# PresaIA — Configuración central
# Todo lo que cambia entre ejecuciones vive aquí, no en el código.
# =============================================================================

[proyecto]
nombre = "PresaIA"
semilla = 42                       # reproducibilidad (RF, XGBoost, datos demo)

[rutas]
datos_crudos     = "data/raw"            # CSV originales del SIH (no se modifican)
datos_demo       = "data/demo"           # CSV SINTÉTICOS en formato SIH (solo para pruebas)
datos_procesados = "data/processed"      # series limpias en formato parquet/csv
catalogo         = "data/raw/0_Catalogo_de_presas.csv"
modelos          = "models"
reportes         = "reports"

[fuentes]
url_base_sih   = "https://sih.conagua.gob.mx/basedatos/Presas/"
url_catalogo   = "https://sih.conagua.gob.mx/basedatos/Presas/0_Catalogo_de_presas.csv"

# -----------------------------------------------------------------------------
# Presas seleccionadas.
# capacidad_namo_hm3: capacidad al Nivel de Aguas Máximas Ordinarias.
#   VALORES DE REFERENCIA — confirmar en el Inventario de Presas
#   (https://presas.conagua.gob.mx/inventario/) y anotar la fecha de consulta.
# latitud/longitud: catálogo del SIH (0_Catalogo_de_presas.csv), consultado 13-oct-2026.
# La presa principal es la primera de la lista.
# -----------------------------------------------------------------------------
[[presas]]
clave = "VBRMX"
nombre = "Valle de Bravo"
estado = "México"
sistema = "Cutzamala"
capacidad_namo_hm3 = 394.39
latitud = 19.2075
longitud = -100.18

[[presas]]
clave = "VVCMX"
nombre = "Villa Victoria"
estado = "México"
sistema = "Cutzamala"
capacidad_namo_hm3 = 185.73
latitud = 19.461667
longitud = -100.055556

[[presas]]
clave = "LBQCH"
nombre = "La Boquilla"
estado = "Chihuahua"
sistema = "Río Conchos"
capacidad_namo_hm3 = 2903.0
latitud = 27.544722
longitud = -105.414167

[limpieza]
fecha_inicio_minima   = "1990-01-01"   # se descartan registros anteriores
max_hueco_interpolar  = 7              # días consecutivos faltantes que se interpolan
max_salto_diario_pct  = 8.0            # cambio diario > X % de la capacidad = sospechoso
min_anios_validos     = 8              # años mínimos con volumen para aceptar una presa
min_cobertura_volumen = 0.70           # fracción mínima de días con volumen en el periodo
# Si hay días con nivel pero sin volumen, reconstruir volumen con una curva
# elevación–volumen ajustada en los días donde existen ambas mediciones.
reconstruir_desde_nivel = true
min_r2_curva            = 0.995        # la curva solo se usa si el ajuste es casi perfecto

[modelo]
horizontes_dias = [7, 15, 30]
lags_dias       = [1, 3, 7, 14, 30]
ventanas_dias   = [7, 30, 90]
# Partición cronológica (fechas de corte, inclusivas al inicio del bloque)
inicio_validacion = "2019-01-01"
inicio_prueba     = "2022-01-01"
usar_precipitacion = true

[modelo.random_forest]
n_estimators     = 300
max_depth        = 14
min_samples_leaf = 5
max_features     = 0.6
n_jobs           = -1

[modelo.xgboost]
n_estimators     = 600
max_depth        = 5
learning_rate    = 0.03
subsample        = 0.8
colsample_bytree = 0.8

[incertidumbre]
nivel_confianza = 0.90             # intervalo por cuantiles de residuos en validación

[alertas]
# Umbrales configurables (porcentaje de llenado respecto a NAMO)
llenado_atencion_pct  = 40.0
llenado_critico_pct   = 25.0
# Descenso proyectado (puntos porcentuales) dentro del horizonte
descenso_atencion_pp  = 3.0
descenso_critico_pp   = 6.0
# Ventana para calcular la tendencia observada reciente
ventana_tendencia_dias = 30
