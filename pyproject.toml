[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "presaia"
version = "1.0.0"
description = "Predicción y alerta temprana del almacenamiento de presas de México"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "django>=5.1",
    "joblib>=1.3",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
presaia = "presaia.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
